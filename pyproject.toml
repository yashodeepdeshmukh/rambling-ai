[project]
name = "rambling"
version = "0.1.0"
description = "Decision-built solver models and Node-RED flows for System One deciders (Laya)"
requires-python = ">=3.10"
dependencies = ["z3-solver>=4.12"]

[project.optional-dependencies]
dev = ["pytest>=8", "onnx>=1.15", "tokenizers>=0.15"]
poc = ["numpy>=1.24", "scikit-learn>=1.3"]
zeroshot = ["numpy>=1.24", "wordllama>=0.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
